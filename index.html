#view{width:100%;height:100%;display:block}

#caption.show{opacity:1}
#speaker{color:#ffe46a;font-size:.65em;display:block;margin-bottom:3px}
#panel{position:fixed;left:10px;right:10px;bottom:10px;z-index:7;display:flex;gap:7px;align-items:center;justify-content:center}
button{border:1px solid #ffffff70;background:#172432e8;color:#fff;border-radius:11px;padding:10px 12px;font-weight:800;font-size:12px;box-shadow:0 3px 12px #0003}
button:active{transform:scale(.96)}
#log{position:fixed;top:88px;left:10px;width:min(220px,48vw);z-index:5;background:#eafaffd9;color:#173b46;border-radius:10px;padding:8px;font-size:10px;line-height:1.4;pointer-events:none}
#log strong{font-size:10px}
#loglines{margin-top:4px;max-height:90px;overflow:hidden}
#tag{position:fixed;right:10px;top:10px;z-index:5;background:#15212dcc;color:white;padding:6px 9px;border-radius:8px;font-size:10px}
#help{position:fixed;right:10px;bottom:65px;z-index:6;background:#eafaffed;color:#173b46;padding:8px 10px;border-radius:10px;font-size:10px;max-width:170px}
</style>
</head>

function caption(name,txt){speakerEl.textContent=name;wordsEl.textContent=txt;captions.classList.add('show');captionTimer=3.1}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function clearSet(){while(set.children.length){let o=set.children[0];set.remove(o);o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material){if(Array.isArray(n.material))n.material.forEach(m=>m.dispose());else n.material.dispose()}})}actors=[];decor=[]}
function makeActor(index,x,shirtColor,role){
 const root=new THREE.Group();root.position.set(x,0,.15);set.add(root);
 const torso=mesh(new THREE.CapsuleGeometry(.29,.62,5,14),M(shirtColor,.8),root,0,1.02,0);
 const neck=mesh(new THREE.CylinderGeometry(.075,.09,.15,12),skin,root,0,1.48,0);
 const head=new THREE.Group();head.position.y=1.72;root.add(head);
 mesh(new THREE.SphereGeometry(.235,20,16),M([0xe8b99b,0xc98e70,0xf0c9a8][index%3],.8),head,0,0,0);
 mesh(new THREE.SphereGeometry(.24,18,12,0,Math.PI*2,0,Math.PI*.52),M([0x211c1b,0x3b2922,0x161a22][index%3]),head,0,.06,-.015);
 for(let s of [-1,1]){mesh(new THREE.SphereGeometry(.025,8,8),M(0x151515),head,s*.082,.015,.218)}
 const mouth=mesh(new THREE.SphereGeometry(.025,8,6),M(0x6f3434),head,0,-.075,.22);mouth.scale.set(1,.45,.4);
 const arms=[];
 for(let s of [-1,1]){let a=mesh(new THREE.CapsuleGeometry(.085,.48,4,10),M(shirtColor,.8),root,s*.38,1.04,0);a.rotation.z=-s*.1;arms.push(a)}
 const legs=[];
 for(let s of [-1,1]){let l=mesh(new THREE.CapsuleGeometry(.095,.56,4,10),M(0x252c39,.85),root,s*.14,.36,0);legs.push(l)}
 // simple shoe geometry
 for(let s of [-1,1])mesh(new THREE.BoxGeometry(.2,.12,.34),M(0x171b22),root,s*.14,.08,.08);
 const actor={id:index,name:['민수','지연','태호'][index],role,root,head,torso,arms,legs,mouth,emotion:'중립',mood:0,energy:.5,confidence:.5,goal:['관심을 받고 싶다','분위기를 편하게 만들고 싶다','자기 의견을 인정받고 싶다'][index],memory:[],target:null,think:1+Math.random()*2,act:0,gesture:0,walk:0,phase:Math.random()*6,voice:0};

function remember(a,b,what){a.memory.push({who:b.name,what,time:elapsed});if(a.memory.length>8)a.memory.shift()}
function setEmotion(a,e,amount=.6){a.emotion=e;a.mood=Math.max(-1,Math.min(1,a.mood+amount))}
function react(a,b,kind){
 if(kind==='joke'){setEmotion(a,Math.random()<.65?'웃음':'당황',.45);a.energy=Math.min(1,a.energy+.2)}
 else if(kind==='challenge'){setEmotion(a,'승부욕',.55);a.confidence=Math.min(1,a.confidence+.2)}
 else if(kind==='tease'){setEmotion(a,Math.random()<.55?'짜증':'웃음',-.25);a.target=b}
 else if(kind==='support'){setEmotion(a,'안도',.3);a.energy=Math.min(1,a.energy+.1)}
 remember(a,b,kind);
}
function chooseAction(a){

 else if(channel===4){act=r<.55?'question':r<.8?'support':'comment'}
 else if(channel===6){act=r<.42?'question':r<.75?'support':'comment'}
 else {act=r<.4?'confront':r<.7?'question':'comment'}
 if(a.mood<-.4&&Math.random()<.5)act='confront';
 if(a.energy<.2)act='quiet';
 return {act,b};
}

 if(act==='tease'){text=channel===6?'아까부터 왜 그렇게 조용해요?':rand(['야, 너 아까 실수한 거 봤어.','그걸 진짜 믿은 거야?','너 지금 표정 완전 웃겨.']);kind='tease';react(b,a,'tease');}
 if(act==='challenge'){text=rand(['이번엔 내가 이길 거야!','그렇게 자신 있어? 한번 해보자.','좋아, 승부 보자고.']);kind='challenge';react(b,a,'challenge')}
 if(act==='joke'){text=rand(['아니, 그게 말이 돼? 하하!','잠깐만, 나 지금 진지해.','이 상황 자체가 너무 웃기잖아.']);kind='joke';react(b,a,'joke')}
 if(act==='question'){text=rand(['너는 어떻게 생각해?','아까 그 말, 무슨 뜻이야?','솔직히 말해봐.']);b.target=a;setEmotion(b,'생각 중',.1);remember(b,a,'질문을 받음')}
 if(act==='support'){text=rand(['괜찮아, 천천히 말해.','나는 네 말 이해해.','그럴 수도 있지.']);react(b,a,'support')}
 if(act==='present')text=rand(['지금 이 부분을 주목해주세요!','직접 한번 보여드릴게요.','이건 정말 특별한데요?']);
 if(act==='confront'){text=rand(['아니, 그건 좀 아니지.','왜 내 말은 안 듣는 건데?','잠깐, 그 얘기는 다르잖아.']);setEmotion(b,'당황',-.3);remember(b,a,'말다툼')}
 if(act==='quiet')text='음… 잠깐 생각 좀 해볼게.';
 if(act==='comment')text=rand(lineset);
 caption(a.name,text);lastSpeaker=a.id;log(a.name+' → '+b.name+'에게 '+({tease:'장난',challenge:'도전',joke:'농담',question:'질문',support:'공감',present:'상품 소개',confront:'반박',quiet:'잠시 침묵',comment:'이야기'}[act]||'이야기'));
 a.mood=Math.max(-1,Math.min(1,a.mood+(act==='joke'?.12:act==='confront'?-.2:.04)));
}
function surprise(){
 let a=rand(actors),b=rand(actors.filter(x=>x!==a));
 const events=[
 ()=>{setEmotion(a,'깜짝 놀람',.5);caption(a.name,'어어!? 갑자기 뭐야!');log('갑작스러운 소리에 모두가 놀랐습니다.')},
 ()=>{setEmotion(b,'웃음',.5);caption(b.name,'하하하! 진짜 웃기다.');react(a,b,'joke');log(b.name+'이 크게 웃기 시작했습니다.')},
 ()=>{setEmotion(a,'짜증',-.55);caption(a.name,'아니, 잠깐만! 그건 아니잖아.');log('출연자 사이에 작은 신경전이 생겼습니다.')},
 ()=>{setEmotion(a,'당황',-.2);caption(a.name,'어… 나한테 물어본 거야?');log(a.name+'이 갑자기 지목당했습니다.')},
 ()=>{setEmotion(b,'호기심',.3);caption(b.name,'저거 뭐야? 한번 보여줘!');log('출연자들이 새로운 소품에 관심을 보입니다.')}
 ];rand(events)();a.gesture=1.3;b.gesture=.8;a.target=b;
}
function updateActor(a,dt){
 a.think-=dt;a.act=Math.max(0,a.act-dt);a.gesture=Math.max(0,a.gesture-dt);a.voice=Math.max(0,a.voice-dt);
 a.energy=Math.min(1,a.energy+dt*.012);a.mood*=Math.pow(.985,dt*60);
 a.phase+=dt;
 let root=a.root;
 root.position.y=.025*Math.sin(elapsed*2+a.phase);
 root.rotation.y=.06*Math.sin(elapsed*1.1+a.phase);
 a.head.rotation.y=a.target?THREE.MathUtils.damp(a.head.rotation.y,Math.sign(a.target.root.position.x-root.position.x)*.24,3,dt):THREE.MathUtils.damp(a.head.rotation.y,0,2,dt);
 a.head.rotation.x=THREE.MathUtils.damp(a.head.rotation.x,a.voice>0?-.08:0,5,dt);
 let gestureAmp=a.gesture>0?Math.sin((1.8-a.gesture)*9)*.65:0;
 a.arms[0].rotation.z=THREE.MathUtils.damp(a.arms[0].rotation.z,-.12-gestureAmp*.65,5,dt);
 a.arms[1].rotation.z=THREE.MathUtils.damp(a.arms[1].rotation.z,.12+gestureAmp,5,dt);
 a.torso.rotation.z=THREE.MathUtils.damp(a.torso.rotation.z,a.act>0?Math.sin(elapsed*5+a.phase)*.07:0,3,dt);
 a.mouth.scale.y=a.voice>0?.8+.7*Math.abs(Math.sin(elapsed*18+a.phase)):.45;
 a.legs.forEach((l,i)=>{l.rotation.x=a.act>0&&a.emotion==='승부욕'?Math.sin(elapsed*9+i)*.18:0});
 if(a.think<=0&&a.act<=0){
   a.think=1.5+Math.random()*3.8;
   if(Math.random()<.78){let {act,b}=chooseAction(a);perform(a,act,b)}
 }
}
function updateCamera(dt){
 camTimer-=dt;if(camTimer<=0){camTimer=3.5+Math.random()*5;
 let mode=Math.random();
 if(mode<.35){let a=rand(actors);bcam.position.set(a.root.position.x+(Math.random()-.5)*.45,2.2,5.4);bcam.lookAt(a.root.position.x,1.45,0)}
 else if(mode<.65){let a=rand(actors),b=a.target||rand(actors.filter(x=>x!==a));let mid=(a.root.position.x+b.root.position.x)/2;bcam.position.set(mid,2.25,7.2);bcam.lookAt(mid,1.45,0)}
 else{bcam.position.set((Math.random()-.5)*.8,2.8,9.5);bcam.lookAt(0,1.5,0)}
 }}
function frame(){
 requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.05);
 if(!paused){elapsed+=dt;eventTimer-=dt;actors.forEach(a=>updateActor(a,dt));decor.forEach(o=>{if(o.geometry.type==='TorusKnotGeometry'||o.geometry.type==='IcosahedronGeometry'){o.rotation.x+=dt*.4;o.rotation.y+=dt*.65}});updateCamera(dt);
 if(eventTimer<=0){eventTimer=9+Math.random()*12;if(Math.random()<.36)surprise()}
 if(captionTimer>0){captionTimer-=dt;if(captionTimer<=0)captions.classList.remove('show')}
 rig.position.y=1+.025*Math.sin(elapsed*1.7);
 }
 renderer.setRenderTarget(rt);renderer.render(broadcast,bcam);renderer.setRenderTarget(null);renderer.render(world,camera);
}
frame();
function change(d){channel=(channel+d+channels.length)%channels.length;buildChannel()}
document.querySelector('#prev').onclick=()=>change(-1);document.querySelector('#next').onclick=()=>change(1);
document.querySelector('#event').onclick=()=>surprise();
document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 재개':'Ⅱ 일시정지';document.querySelector('#status').textContent=paused?'Ⅱ 방송 일시정지':'● LIVE · '+channels[channel].name+' · 자율 상호작용'};
canvas.addEventListener('pointerup',e=>{if(e.clientY<innerHeight*.78&&e.clientX<innerWidth*.75)surprise()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')change(1);if(e.key==='ArrowLeft')change(-1);if(e.key===' ')surprise()});
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script>
</body></html>
