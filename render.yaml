services:
  - type: web
    name: channel-zap-3d
    runtime: static
    buildCommand: echo "No build step required"
    staticPublishPath: .
    branch: main
    autoDeployTrigger: commit

  - type: web
    name: channel-zap-3d-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    branch: main
    autoDeployTrigger: commit
